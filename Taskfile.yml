version: "3"

tasks:
  setup:check:
    desc: Audit repository prerequisites without changing the system
    cmds:
      - node .agents/skills/setup/scripts/check.mjs
  test:
    desc: Test the builder scaffold
    cmds:
      - node skills/website-automation-builder/scripts/test-scaffold.mjs
      - node skills/website-automation-builder/scripts/test-demo.mjs
  install:opencode:
    desc: Install all skills globally for OpenCode
    cmds:
      - npx --yes skills add FabianSieper/skills --skill '*' --agent opencode --global --yes
  openwiki:update:
    desc: Update the repository OpenWiki documentation
    cmds:
      - openwiki --update
