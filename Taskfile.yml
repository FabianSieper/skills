version: "3"

tasks:
  setup:check:
    desc: Audit repository prerequisites without changing the system
    cmds:
      - node .agents/skills/setup/scripts/check.mjs
  test:
    desc: Check website concept wiring and the illustrative UI model (no browser)
    cmds:
      - node scripts/verify-website-concept.mjs
      - node --experimental-strip-types --test docs/strict-automation/ui-model.test.mjs
  test:cardmarket:
    desc: Typecheck and test the current Cardmarket implementation
    cmds:
      - npm --prefix skills/cardmarket-automation run typecheck
      - npm --prefix skills/cardmarket-automation test
  install:opencode:
    desc: Install the Cardmarket runtime skill globally for OpenCode
    cmds:
      - npx --yes skills add FabianSieper/skills --skill cardmarket-automation --agent opencode --global --yes
      - node scripts/install-deps.mjs
  sync:agents:
    desc: Sync the repo Cardmarket skill into the installed global copy (preserves node_modules)
    cmds:
      - node scripts/sync-installed.mjs
